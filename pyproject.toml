[project]
name = "calc-mcp"
version = "1.0.0"
description = "MCP server calculator for AI-assisted computation"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "sympy>=1.12",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "pandas>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
